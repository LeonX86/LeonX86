# GitHub Action for generating a contribution graph with a snake eating your contributions.
# Output goes to the orphan branch `profile-snake-contrib` (auto-created), so `main`
# stays clean: no daily bot commits, fixed image URLs that never change.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * 1" # every Monday 00:00 UTC (contribution data itself refreshes at most once a day; weekly is plenty)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake (svg only, faster)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy snake files to orphan branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: profile-snake-contrib
          folder: dist
          clean: true
          target-folder: .
          commit-message: 'Update contribution snake'
